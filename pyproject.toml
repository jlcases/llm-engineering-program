[project]
name = "llm-engineering-program"
version = "0.1.0"
description = "Ruta abierta de Ingeniería de Sistemas LLM — labs y pruebas de trabajo"
requires-python = ">=3.12"
dependencies = [
    # Base (módulos 1-2)
    "openai>=3.3,<4",
    "anthropic>=1.0,<2",
    "boto3>=1.34",
    "tiktoken>=0.14,<1",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "rich>=15,<16",
    "httpx>=0.27",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
rag = [
    # Módulo 3
    "qdrant-client>=1.19,<2",
    "sentence-transformers>=6,<7",
    "cohere>=7,<8",
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
    "pypdf>=6.16,<7",
    "numpy>=2,<3",
]
agents = [
    # Módulo 4
    "langgraph>=1.2,<2",
    "mcp[cli]>=2,<3",
]
ops = [
    # Módulo 8
    "langsmith>=0.11,<1",
    "prometheus-client>=0.26,<1",
    "locust>=2.46,<3",
]
dev = [
    "bandit>=1.9,<2",
    "coverage[toml]>=7.13,<8",
    "fastapi>=0.141,<1",
    "pip-audit>=2.10,<3",
    "pytest>=9,<10",
    "ruff>=0.16,<1",
]
all = ["llm-engineering-program[rag,agents,ops]"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["modulo-03-rag/proyecto/backend/tests", "tests"]
pythonpath = ["modulo-03-rag/proyecto/backend"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    ".venv/*",
    "tests/*",
    "*/tests/*",
    "translations/en/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
