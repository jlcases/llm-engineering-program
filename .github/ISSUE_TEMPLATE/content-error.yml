name: Report content error / Corregir contenido
description: Report a claim, link, example or explanation that needs correction.
title: "[Content fix] "
labels: [content-bug]
body:
  - type: input
    id: path
    attributes:
      label: Affected path / Ruta afectada
      placeholder: modulo-03-rag/teoria/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or outdated / Qué está mal o desactualizado
      description: Include the smallest useful excerpt and its educational impact. / Incluye el fragmento mínimo y su impacto educativo.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Evidencia
      description: Link a primary source or a minimal reproduction. / Enlaza una fuente primaria o una reproducción mínima.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction / Corrección propuesta
      description: Explain the expected change; open a PR directly when the fix is clear. / Explica el cambio esperado o abre una PR.
    validations:
      required: true
