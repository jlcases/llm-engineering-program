name: Corregir contenido / Report content error
description: Señala un dato, enlace, ejemplo o explicación que deba corregirse.
title: "[Corrección] "
labels: [content-bug]
body:
  - type: input
    id: path
    attributes:
      label: Ruta afectada
      placeholder: modulo-03-rag/teoria/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Qué está mal o desactualizado
      description: Incluye el fragmento mínimo necesario y el impacto educativo.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Enlaza la fuente primaria o una reproducción mínima del fallo.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Corrección propuesta
      description: Explica el cambio esperado; puedes abrir directamente una PR si ya está claro.
    validations:
      required: true
